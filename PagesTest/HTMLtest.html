<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realtime HTML Editor</title>
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/semantic-ui@2.4.2/dist/semantic.min.js"></script>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.css">
    
    <!-- CodeMirror Library & Theme (Monokai / Dark Theme) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>

    <style>
        body {
            display: flex;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: Arial, sans-serif;
            user-select: none; /* Mencegah seleksi teks saat dragging */
        }

        .left-pane {
            display: flex;
            flex-direction: column;
            width: 50%; /* Default width */
            min-width: 150px;
            background-color: #111;
            overflow: hidden;
        }

        .button-row {
            display: flex;
            gap: 10px;
            margin: 10px;
            flex-shrink: 0;
        }

        /* Penyesuaian agar CodeMirror mengisi sisa tinggi left-pane */
        .CodeMirror {
            flex-grow: 1;
            height: 100% !important;
            font-size: 14px;
        }

        iframe {
            flex-grow: 1;
            width: 0; /* Menggunakan flexbox untuk mengatur lebar sisa */
            height: 100%;
            border: none;
            box-sizing: border-box;
            background-color: #fff;
        }

        /* Matikan pointer-events pada iframe saat dragging agar tidak patah-patah */
        .is-resizing iframe {
            pointer-events: none;
        }

        .resizer {
            width: 8px;
            cursor: col-resize;
            background-color: #2b2b2b;
            height: 100%;
            flex-shrink: 0;
            transition: background-color 0.2s;
            position: relative;
            z-index: 10;
        }

        .resizer:hover, body.is-resizing .resizer {
            background-color: #2185d0; /* Warna biru Semantic UI saat dihover/drag */
        }
    </style>
</head>
<body>
	<h2>Realtime HTML Editor with Syntax Highlightning</h2>
    <div class="left-pane">
      <div class="button-row">
		<button class="ui mini yellow button" id="openFileBtn"><i class="folder open icon"></i>Open File</button>
		<input type="file" id="fileInput" accept=".html,.htm,.txt" style="display: none;">
		<button class="ui mini red button" id="copyToClipboard"><i class="copy icon"></i>Copy to Clpbrd</button>
		<button class="ui mini purple button" id="pasteFromClipboard"><i class="copy icon"></i>Paste Clpbrd</button>
		<button class="ui mini green button" id="savefile"><i class="copy icon"></i>Save to file</button>
		<button class="ui mini blue button" onclick="toggleWhiteSpace()">Toggle WordWrap</button>
      </div>
        <textarea id="editor"></textarea>
    </div>
    <div class="resizer" id="resizer"></div>
    <iframe id="preview"></iframe>

    <script>
        const preview = document.getElementById('preview');
        const resizer = document.getElementById('resizer');
        const leftPane = document.querySelector('.left-pane');

        // Inisialisasi CodeMirror Syntax Highlighting
        const editorInstance = CodeMirror.fromTextArea(document.getElementById('editor'), {
            mode: 'htmlmixed',
            theme: 'monokai',
            lineNumbers: true,
            lineWrapping: false
        });

        // Handle live preview dari CodeMirror
        editorInstance.on('change', () => {
            preview.srcdoc = editorInstance.getValue();
        });

        // Initialize preview dengan konten awal
        preview.srcdoc = editorInstance.getValue();

        // High Performance Resizer Logic
        let isResizing = false;

        resizer.addEventListener('mousedown', (e) => {
            isResizing = true;
            document.body.classList.add('is-resizing');
            document.body.style.cursor = 'col-resize';
            e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;

            // Hitung lebar panel kiri berdasarkan posisi kursor relatif terhadap layar
            const containerWidth = window.innerWidth;
            let newLeftWidth = e.clientX;

            // Beri batasan minimal dan maksimal pergeseran (misal: minimal 150px dari tepi)
            const minWidth = 150;
            const maxWidth = containerWidth - 150;

            if (newLeftWidth < minWidth) newLeftWidth = minWidth;
            if (newLeftWidth > maxWidth) newLeftWidth = maxWidth;

            leftPane.style.width = `${newLeftWidth}px`;
            
            // Refresh tampilan editor CodeMirror agar menyesuaikan ukuran baru
            editorInstance.refresh();
        });

        document.addEventListener('mouseup', () => {
            if (isResizing) {
                isResizing = false;
                document.body.classList.remove('is-resizing');
                document.body.style.cursor = 'default';
                editorInstance.refresh();
            }
        });
	
	function toggleWhiteSpace() {
        const isWrapping = editorInstance.getOption('lineWrapping');
        editorInstance.setOption('lineWrapping', !isWrapping);
	}
	
$(document).ready(function () {

	// Open File handler
	$('#openFileBtn').click(function () {
		$('#fileInput').click();
	});

	$('#fileInput').change(function (e) {
		const file = e.target.files[0];
		if (!file) return;

		const reader = new FileReader();
		reader.onload = function (evt) {
			const content = evt.target.result;
			editorInstance.setValue(content);
		};
		reader.readAsText(file);
		$(this).val('');
	});

	$('#savefile').click(function () {
		var textToSave = editorInstance.getValue();  
		var textToSaveAsBlob = new Blob([textToSave], {type:"text/plain"});  
		var textToSaveAsURL = window.URL.createObjectURL(textToSaveAsBlob);  

		var downloadLink = document.createElement("a");  
		downloadLink.href = textToSaveAsURL;  
		downloadLink.download = 'edited_file.html';  
		downloadLink.innerHTML = "Download File";  
		downloadLink.onclick = function(event) {
			document.body.removeChild(event.target);  
		};
		downloadLink.style.display = "none";  
		document.body.appendChild(downloadLink);  
		downloadLink.click();  
	});

        // Copy to Clipboard
        $('#copyToClipboard').click(function () {
            const content = editorInstance.getValue();
            navigator.clipboard.writeText(content);
        });

        // Paste from Clipboard
        $('#pasteFromClipboard').click(async function () {
            const clipboardText = await navigator.clipboard.readText();
            editorInstance.setValue(clipboardText);
        });
  
})
    </script>
</body>
</html>
